name: 发布Windows玩家包
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 构建完整解决方案
        run: dotnet build -c Release
      - name: 构建加载器和正式内容模组包
        shell: pwsh
        run: ./tools/package-release.ps1 -Version $env:GITHUB_REF_NAME
      - name: 创建GitHubRelease并上传玩家包
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/release/*-Windows-x64.zip
            artifacts/release/*-Mods.zip
            artifacts/release/SHA256SUMS.txt
