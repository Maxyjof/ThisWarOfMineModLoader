name: 构建与验证
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet build -c Release
      - run: dotnet run --project ThisWarOfMineModLoader.Tests -c Release --no-build
      - run: python -m pip install -r tests/requirements.txt
      - run: python -X utf8 tests/test_runtime.py
      - run: python -X utf8 tests/test_modpack.py
